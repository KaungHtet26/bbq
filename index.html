<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BBQ Table Reservation</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f2;color:#202820;font-family:Arial,"Noto Sans JP",sans-serif}
header{background:#202a23;color:white;padding:20px;text-align:center}
main{max-width:900px;margin:20px auto;padding:0 15px}
.card{background:white;padding:22px;border-radius:16px;box-shadow:0 3px 15px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;margin-bottom:6px;color:#666}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:9px;font-size:16px}
.tables{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:12px}
.table{padding:15px 5px;border:1px solid #ddd;background:white;border-radius:10px;cursor:pointer}
.table.selected{outline:3px solid #b9412d}
.table:disabled{background:#eee;color:#999;cursor:not-allowed}
button{font-size:15px}
.book{width:100%;padding:16px;margin-top:20px;border:0;border-radius:10px;background:#b9412d;color:white;font-weight:bold;cursor:pointer}
.book:disabled{opacity:.5}
.languages{text-align:right;margin-bottom:12px}
.languages button{padding:8px 14px;border:0;border-radius:20px;cursor:pointer}
.note{color:#666;font-size:13px;line-height:1.6}
#message{padding:12px;margin-top:12px;border-radius:8px;display:none}
@media(max-width:600px){.grid{grid-template-columns:1fr}.tables{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h2 id="title">BBQテーブル予約</h2></header>
<main>
<div class="languages">
<button onclick="setLanguage('ja')">日本語</button>
<button onclick="setLanguage('en')">English</button>
</div>
<div class="card">
<div class="grid">
<div><label id="dateLabel">予約日</label><input type="date" id="date"></div>
<div><label id="timeLabel">開始時間</label><select id="time"></select></div>
<div><label id="guestsLabel">人数（最大8名）</label><select id="guests"></select></div>
<div><label id="durationLabel">利用時間</label><select id="duration">
<option value="90">90分</option>
<option value="120">120分</option>
<option value="180">180分</option>
</select></div>
<div><label id="nameLabel">お名前</label><input id="name"></div>
<div><label id="phoneLabel">電話番号</label><input id="phone" type="tel"></div>
</div>
<h3 id="tableLabel">テーブルを選択</h3>
<div id="tables" class="tables"></div>
<p id="rules" class="note">営業時間 9:00〜15:00 / 1テーブル最大8名</p>
<button class="book" id="submit">予約する</button>
<div id="message"></div>
<p class="note" id="cancel">キャンセルの場合はお電話ください。
<a href="tel:0569226161">0569-22-6161</a></p>
</div>
</main>
<script>
const db=supabase.createClient(
'https://ywbfhbmrrhanwmzmgyvt.supabase.co',
'sb_publishable_qeRWsu3miuySxebdZJ7mNg_Jtnzh20d'
);
const $=id=>document.getElementById(id);
let language='ja',selectedTable=null,bookings=[],ready=false,requestId=0;
const translations={
ja:{title:'BBQテーブル予約',date:'予約日',time:'開始時間',guests:'人数（最大8名）',duration:'利用時間',name:'お名前',phone:'電話番号',table:'テーブルを選択',rules:'営業時間 9:00〜15:00 / 1テーブル最大8名 / 基本90分',book:'予約する',available:'空き',busy:'予約済',choose:'選択してください',success:'予約が完了しました。',error:'予約できませんでした。再度お試しください。',required:'すべての項目を入力してください。',cancel:'キャンセルの場合はお電話ください。'},
en:{title:'BBQ Table Reservation',date:'Date',time:'Start time',guests:'Guests (max 8)',duration:'Duration',name:'Name',phone:'Phone',table:'Select a table',rules:'Open 9:00–15:00 / Maximum 8 guests per table / Standard 90 minutes',book:'Book Now',available:'Available',busy:'Booked',choose:'Please select',success:'Reservation confirmed.',error:'Booking failed. Please try again.',required:'Please complete all fields.',cancel:'To cancel, please call us.'}
};
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function mins(s){let a=s.slice(0,5).split(':').map(Number);return a[0]*60+a[1]}
function renderTimes(){
let old=$('time').value,dur=+$('duration').value;
$('time').innerHTML='<option value="">'+translations[language].choose+'</option>';
for(let m=540;m+dur<=900;m+=30){
let option=document.createElement('option');
option.value=fmt(m);option.textContent=fmt(m);
$('time').appendChild(option);
}
if([...$('time').options].some(o=>o.value===old))$('time').value=old;
refresh();
}
async function refresh(){
let id=++requestId;
selectedTable=null;ready=false;
$('tables').innerHTML='';
let date=$('date').value,time=$('time').value;
if(!date||!time)return;
$('tables').textContent='Loading...';
const {data,error}=await db.rpc('bbq_availability',{p_date:date});
if(id!==requestId)return;
if(error){
console.error(error);
$('tables').textContent='Availability error. Please retry.';
return;
}
bookings=data||[];
ready=true;
let start=mins(time),end=start+(+$('duration').value);
$('tables').innerHTML='';
for(let n=1;n<=10;n++){
let busy=bookings.some(r=>Number(r.table_no)===n&&start<mins(r.end_time)&&mins(r.start_time)<end);
let b=document.createElement('button');
b.type='button';b.className='table';b.disabled=busy;
b.innerHTML='<b>Table '+n+'</b><div>'+(busy?translations[language].busy:translations[language].available)+'</div>';
b.onclick=()=>{
selectedTable=n;
document.querySelectorAll('.table').forEach(x=>x.classList.remove('selected'));
b.classList.add('selected');
};
$('tables').appendChild(b);
}
}
function setLanguage(lang){
language=lang;
let t=translations[lang];
$('title').textContent=t.title;
['date','time','guests','duration','name','phone'].forEach(k=>$(k+'Label').textContent=t[k]);
$('tableLabel').textContent=t.table;
$('rules').textContent=t.rules;
$('submit').textContent=t.book;
$('cancel').innerHTML=t.cancel+' <a href="tel:0569226161">0569-22-6161</a>';
[...$('duration').options].forEach(o=>o.textContent=o.value+(lang==='ja'?'分':' min'));
renderTimes();
}
function showMessage(message,success){
$('message').style.display='block';
$('message').style.background=success?'#e8f5eb':'#ffe7e7';
$('message').textContent=message;
}
$('submit').onclick=async()=>{
let date=$('date').value,time=$('time').value;
let duration=+$('duration').value,guests=+$('guests').value;
let name=$('name').value.trim(),phone=$('phone').value.trim();
if(!ready||!date||!time||!selectedTable||!guests||!name||!phone){
showMessage(translations[language].required,false);return;
}
let table=selectedTable;
$('submit').disabled=true;
try{
const {data,error}=await db.rpc('bbq_create_booking',{
p_date:date,p_start:time,p_duration:duration,
p_table:table,p_guests:guests,p_name:name,p_phone:phone
});
if(error)throw error;
showMessage(translations[language].success+' '+date+' / '+time+' / Table '+table,true);
$('name').value='';$('phone').value='';
await refresh();
}catch(e){
console.error(e);
showMessage(translations[language].error,false);
await refresh();
}finally{$('submit').disabled=false;}
};
$('date').onchange=refresh;
$('time').onchange=refresh;
$('duration').onchange=renderTimes;
let now=new Date();
let today=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
$('date').min=today;$('date').value=today;
$('guests').innerHTML='<option value="">選択してください</option>';
for(let i=1;i<=8;i++){
let o=document.createElement('option');
o.value=i;o.textContent=i;
$('guests').appendChild(o);
}
setLanguage('ja');
</script>
</body>
</html>
