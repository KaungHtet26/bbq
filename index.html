<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BBQ Table Reservation</title><style>
:root{--bg:#f5f5f2;--card:#fff;--text:#1e2520;--accent:#b9412d;--green:#2f7d4a;--muted:#70766f;--line:#ddd}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text)}header{background:#202a23;color:#fff;padding:18px 16px;position:sticky;top:0;z-index:3}.bar{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0}.lang button,.tabs button{border:0;border-radius:999px;padding:8px 12px;cursor:pointer}.lang button.active,.tabs button.active{background:var(--accent);color:#fff}.wrap{max-width:900px;margin:22px auto;padding:0 14px}.tabs{display:flex;gap:8px;margin-bottom:14px}.card{background:var(--card);border-radius:16px;padding:20px;box-shadow:0 3px 16px #00000012;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:white}.tables{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:8px}.table{padding:15px 5px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:center}.table.sel{outline:3px solid var(--accent);border-color:transparent}.table.busy{background:#eee;color:#999;cursor:not-allowed;text-decoration:line-through}.primary{width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);color:white;font-weight:700;font-size:16px;cursor:pointer;margin-top:16px}.note{font-size:13px;color:var(--muted);line-height:1.5}.ok{padding:12px;border-radius:10px;background:#e8f5eb;color:#205d35;margin-top:12px;display:none}.adminRow{display:grid;grid-template-columns:1.1fr .8fr .6fr .8fr .9fr auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee;font-size:14px}.danger{border:0;border-radius:8px;padding:7px 9px;cursor:pointer}.badge{font-size:12px;background:#eef4ef;border-radius:999px;padding:4px 7px}.empty{color:#888;text-align:center;padding:24px}.stat{display:flex;gap:10px;flex-wrap:wrap}.stat span{background:#f2f4f2;padding:8px 11px;border-radius:10px;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.tables{grid-template-columns:repeat(2,1fr)}.adminRow{grid-template-columns:1fr 1fr}.adminRow>*:nth-child(5){grid-column:1/2}.adminRow button{grid-column:2/3}.bar{align-items:flex-start}h1{font-size:17px}}
</style></head><body><header><div class="bar"><h1 id="title">BBQテーブル予約</h1><div class="lang"><button id="jaBtn" class="active">日本語</button><button id="enBtn">English</button></div></div></header><main class="wrap"><div class="tabs"><button id="bookTab" class="active">予約</button><button id="adminTab">管理</button></div><section id="book"><div class="card"><div class="grid"><div><label data-k="date">予約日</label><input id="date" type="date" required></div><div><label data-k="time">開始時間</label><select id="time" required></select></div><div><label data-k="guests">人数（最大8名）</label><select id="guests" required><option value="">選択してください</option></select></div><div><label data-k="duration">利用時間</label><select id="duration" required><option value="90">90分</option><option value="180">180分</option><option value="270">270分</option></select></div><div><label data-k="name">お名前</label><input id="name" placeholder="お名前" required></div><div><label data-k="phone">電話番号</label><input id="phone" type="tel" placeholder="090-0000-0000" required></div></div><h3 data-k="choose">テーブルを選択</h3><div id="tables" class="tables"></div><p class="note" id="rule">営業時間 9:00〜15:00 / 1テーブル最大8名 / 基本90分。空きがある場合は延長できます。</p><button id="submit" class="primary">予約する</button><p class="note" id="cancelNote">ご予約をキャンセルされる場合は、お電話にてご連絡ください。 <a href="tel:0569226161"><b>0569-22-6161</b></a></p><div id="ok" class="ok"></div></div></section><section id="admin" style="display:none"><div class="card"><h2 id="adminTitle">予約管理</h2><div class="stat"><span id="count"></span><span id="todayCount"></span></div><div id="list"></div></div></section></main><script>
const $=id=>document.getElementById(id);let lang='ja',selectedTable=null;
const t={ja:{title:'BBQテーブル予約',book:'予約',admin:'管理',date:'予約日',time:'開始時間',guests:'人数（最大8名）',duration:'利用時間',name:'お名前',phone:'電話番号',choose:'テーブルを選択',rule:'営業時間 9:00〜15:00 / 1テーブル最大8名 / 基本90分。空きがある場合は延長できます。',submit:'予約する',adminTitle:'予約管理',available:'空き',booked:'予約済',err:'入力内容とテーブルを確認してください。',conflict:'この時間はすでに予約されています。',success:'予約が完了しました。',none:'予約はありません。',del:'取消',total:'予約件数',today:'本日の予約',mins:'分',select:'選択してください',cancelNote:'ご予約をキャンセルされる場合は、お電話にてご連絡ください。'},en:{title:'BBQ Table Reservation',book:'Booking',admin:'Admin',date:'Date',time:'Start time',guests:'Guests (max. 8)',duration:'Duration',name:'Name',phone:'Phone',choose:'Select a table',rule:'Open 9:00–15:00 / Max. 8 guests per table / Standard session 90 minutes. Extensions are available when there is no conflicting reservation.',submit:'Book Now',adminTitle:'Reservation Management',available:'Available',booked:'Booked',err:'Please complete the form and select a table.',conflict:'That table is already booked for this time.',success:'Your reservation is confirmed.',none:'No reservations.',del:'Cancel',total:'Reservations',today:"Today's bookings",mins:'min',select:'Please select',cancelNote:'If you would like to cancel your reservation, please contact us by phone.'}};
function reservations(){return JSON.parse(localStorage.getItem('bbqReservations')||'[]')}function save(x){localStorage.setItem('bbqReservations',JSON.stringify(x))}
function init(){let d=new Date(),local=new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);$('date').min=local;$('date').value=local;for(let g=1;g<=8;g++)$('guests').innerHTML+=`<option value="${g}">${g}</option>`;renderTimes();applyLang()}function renderTimes(){let dur=+$('duration').value,prev=$('time').value;$('time').innerHTML=`<option value="">${t[lang].select}</option>`;for(let m=540;m+dur<=900;m+=30){let h=Math.floor(m/60),mm=String(m%60).padStart(2,'0');$('time').innerHTML+=`<option value="${m}">${h}:${mm}</option>`}if([...$('time').options].some(o=>o.value===prev))$('time').value=prev;renderTables()}
function overlaps(a,b,c,d){return a<d&&c<b}function renderTables(){selectedTable=null;let date=$('date').value,start=+$('time').value,dur=+$('duration').value,end=start+dur,rs=reservations();$('tables').innerHTML='';if(!date||!$('time').value)return;for(let n=1;n<=10;n++){let busy=rs.some(r=>r.date===date&&r.table===n&&overlaps(start,end,r.start,r.start+r.duration));let b=document.createElement('button');b.className='table'+(busy?' busy':'');b.innerHTML=`<b>${lang==='ja'?'テーブル':'Table'} ${n}</b><br><small>${busy?t[lang].booked:t[lang].available}</small>`;if(!busy)b.onclick=()=>{document.querySelectorAll('.table').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');selectedTable=n};$('tables').appendChild(b)}}
function applyLang(){$('title').textContent=t[lang].title;$('bookTab').textContent=t[lang].book;$('adminTab').textContent=t[lang].admin;document.querySelectorAll('[data-k]').forEach(x=>x.textContent=t[lang][x.dataset.k]);$('rule').textContent=t[lang].rule;$('submit').textContent=t[lang].submit;$('adminTitle').textContent=t[lang].adminTitle;$('name').placeholder=t[lang].name;$('phone').placeholder=t[lang].phone;$('cancelNote').innerHTML=`${t[lang].cancelNote} <a href="tel:0569226161"><b>0569-22-6161</b></a>`;$('guests').options[0].textContent=t[lang].select;[...$('duration').options].forEach(o=>o.textContent=o.value+' '+t[lang].mins);renderTimes();$('jaBtn').classList.toggle('active',lang==='ja');$('enBtn').classList.toggle('active',lang==='en');renderTables();renderAdmin()}
$('submit').onclick=()=>{let date=$('date').value,start=+$('time').value,duration=+$('duration').value,name=$('name').value.trim(),phone=$('phone').value.trim(),guests=+$('guests').value;if(!date||!$('time').value||!guests||!name||!phone||!selectedTable||start+duration>900){alert(t[lang].err);return}let rs=reservations();if(rs.some(r=>r.date===date&&r.table===selectedTable&&overlaps(start,start+duration,r.start,r.start+r.duration))){alert(t[lang].conflict);renderTables();return}rs.push({id:Date.now(),date,start,duration,name,phone,guests,table:selectedTable});save(rs);$('ok').style.display='block';$('ok').textContent=`${t[lang].success} ${date} / ${fmt(start)} / ${lang==='ja'?'テーブル':'Table'} ${selectedTable}`;$('name').value='';$('phone').value='';renderTables();renderAdmin()};function fmt(m){return Math.floor(m/60)+':'+String(m%60).padStart(2,'0')}
function renderAdmin(){let rs=reservations().sort((a,b)=>(a.date+a.start).localeCompare?.(b.date+b.start)||a.start-b.start),today=new Date().toISOString().slice(0,10);$('count').textContent=`${t[lang].total}: ${rs.length}`;$('todayCount').textContent=`${t[lang].today}: ${rs.filter(r=>r.date===today).length}`;if(!rs.length){$('list').innerHTML=`<div class="empty">${t[lang].none}</div>`;return}$('list').innerHTML=rs.map(r=>`<div class="adminRow"><div><b>${r.date}</b><br>${fmt(r.start)}–${fmt(r.start+r.duration)}</div><div>${lang==='ja'?'テーブル':'Table'} ${r.table}</div><div>${r.guests} ${lang==='ja'?'名':'guests'}</div><div>${esc(r.name)}</div><div>${esc(r.phone)}</div><button class="danger" onclick="delRes(${r.id})">${t[lang].del}</button></div>`).join('')}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.delRes=id=>{save(reservations().filter(r=>r.id!==id));renderAdmin();renderTables()};
$('date').onchange=renderTables;$('time').onchange=renderTables;$('duration').onchange=renderTimes;$('jaBtn').onclick=()=>{lang='ja';applyLang()};$('enBtn').onclick=()=>{lang='en';applyLang()};$('bookTab').onclick=()=>{$('book').style.display='block';$('admin').style.display='none';$('bookTab').classList.add('active');$('adminTab').classList.remove('active')};$('adminTab').onclick=()=>{$('book').style.display='none';$('admin').style.display='block';$('adminTab').classList.add('active');$('bookTab').classList.remove('active');renderAdmin()};init();
</script></body></html>
